name: agentport
description: "Android AI chat client with MCP marketplace and OpenCode remote control."
publish_to: "none"
version: 0.2.2+20200

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.4.0
  http: ^1.6.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  flutter_markdown_plus: ^1.0.12
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  speech_to_text: ^7.5.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3
dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
