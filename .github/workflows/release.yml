name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag ${TAG} (${TAG_COMMIT}) is not on main. Releases must be cut from main."
            exit 1
          fi
          echo "Tag ${TAG} points to ${TAG_COMMIT}, which is on main."

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Derive version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TAG" != v* ]]; then
            echo "::error::Tag must start with 'v', got '${TAG}'."
            exit 1
          fi

          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag must match vMAJOR.MINOR.PATCH, got '${TAG}'."
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::MINOR and PATCH must be 0-99 for the versionCode formula."
            exit 1
          fi

          # PLAN.md 10.2: major * 1_000_000 + minor * 10_000 + patch * 100.
          # This is monotonic for increasing SemVer and matches pubspec.yaml 0.1.0+10000.
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 10000 + 10#$PATCH * 100))
          if (( VERSION_CODE < 1 )); then
            echo "::error::versionCode must be positive."
            exit 1
          fi
          if (( VERSION_CODE > 2100000000 )); then
            echo "::error::versionCode ${VERSION_CODE} exceeds the Android maximum of 2100000000."
            exit 1
          fi

          PUBSPEC_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml | cut -d+ -f1)"
          if [[ "$PUBSPEC_VERSION" != "$VERSION" ]]; then
            echo "::error::pubspec.yaml version is '${PUBSPEC_VERSION}', but tag is '${TAG}'. Bump pubspec.yaml first."
            exit 1
          fi

          {
            echo "VERSION=${VERSION}"
            echo "VERSION_CODE=${VERSION_CODE}"
          } >> "$GITHUB_ENV"

          {
            echo "### Release ${TAG}"
            echo ""
            echo "- Version name: \`${VERSION}\`"
            echo "- Version code: \`${VERSION_CODE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            printf 'storeFile=release-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

          keytool -list \
            -keystore android/app/release-keystore.jks \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          chmod 600 android/key.properties android/app/release-keystore.jks

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --build-name="$VERSION" --build-number="$VERSION_CODE"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="agentport-${TAG}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK_NAME}"
          cd dist
          sha256sum "${APK_NAME}" | tee "${APK_NAME}.sha256" > checksums.txt
          cat "${APK_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AgentPort ${{ env.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/agentport-${{ env.TAG }}.apk
            dist/agentport-${{ env.TAG }}.apk.sha256
            dist/checksums.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/release-keystore.jks
